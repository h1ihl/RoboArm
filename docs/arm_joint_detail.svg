<svg viewBox="0 0 1100 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <style>
    .t   { font-size: 13px; fill: #1a1a1a; }
    .tb  { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
    .s   { font-size: 11.5px; fill: #444; }
    .pla { fill: #d9dde3; stroke: #5d6470; stroke-width: 1.5; }
    .petg{ fill: #bcd4f5; stroke: #2b4a7a; stroke-width: 1.5; }
    .srv { fill: #f6b26b; stroke: #a35a00; stroke-width: 1.5; }
    .stl { fill: #4a4f57; stroke: #1a1a1a; stroke-width: 1; }
    .badge { fill: #1a1a1a; }
    .bt  { font-size: 12px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .lead{ stroke: #1a1a1a; stroke-width: 1; }
  </style>

  <rect width="1100" height="680" fill="#ffffff"/>
  <text x="24" y="34" font-size="22" font-weight="700" fill="#1a1a1a">One servo joint, cut along the joint axis (shoulder shown) — schematic, not to scale</text>
  <text x="24" y="54" class="s">Left-right is the joint axis. The two tall bars are the arm's twin plates (they run about 140 mm up the page to the next joint). Everything else is the fixed bracket.</text>

  <!-- joint axis -->
  <line x1="40" y1="330" x2="590" y2="330" stroke="#888" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="40" y="322" class="s">joint axis</text>

  <!-- 1 servo body + ears -->
  <rect x="92" y="262" width="148" height="136" class="srv"/>
  <text x="166" y="326" text-anchor="middle" class="tb">SERVO</text>
  <text x="166" y="342" text-anchor="middle" class="s">(bought)</text>
  <rect x="232" y="236" width="14" height="188" class="srv"/>
  <line x1="226" y1="247" x2="284" y2="247" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="226" y1="413" x2="284" y2="413" stroke="#1a1a1a" stroke-width="3"/>

  <!-- 2 bracket wall A (with pocket for the servo neck) + base + wall B -->
  <rect x="246" y="170" width="32" height="100" class="petg"/>
  <rect x="246" y="390" width="32" height="100" class="petg"/>
  <rect x="468" y="170" width="32" height="320" class="petg"/>
  <rect x="246" y="490" width="254" height="30" class="petg"/>

  <!-- servo neck through wall A, and shaft -->
  <rect x="246" y="282" width="70" height="96" class="srv"/>
  <rect x="316" y="318" width="46" height="24" class="stl"/>

  <!-- 5 plate 1 (big shaft hole) -->
  <rect x="324" y="112" width="24" height="188" rx="2" class="pla"/>
  <rect x="324" y="360" width="24" height="52" rx="6" class="pla"/>
  <!-- 6 plate 2 (M4 pin hole) -->
  <rect x="432" y="112" width="24" height="210" rx="2" class="pla"/>
  <rect x="432" y="338" width="24" height="74" rx="6" class="pla"/>

  <!-- 4 horn adapter in the gap, metal horn on the shaft -->
  <rect x="349" y="270" width="83" height="120" class="petg"/>
  <rect x="349" y="300" width="22" height="60" class="stl"/>
  <line x1="371" y1="310" x2="396" y2="310" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="371" y1="350" x2="396" y2="350" stroke="#1a1a1a" stroke-width="3"/>

  <!-- M3 bolts through plate 1, adapter, plate 2 -->
  <line x1="320" y1="285" x2="462" y2="285" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="320" y1="375" x2="462" y2="375" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="316" y="279" width="6" height="12" class="stl"/><rect x="316" y="369" width="6" height="12" class="stl"/>
  <rect x="458" y="279" width="8" height="12" class="stl"/><rect x="458" y="369" width="8" height="12" class="stl"/>

  <!-- 7 M4 pin from wall B, through plate 2, into the adapter -->
  <rect x="372" y="324" width="128" height="12" class="stl"/>
  <rect x="500" y="318" width="14" height="24" class="stl"/>

  <!-- plate break marks -->
  <path d="M324,112 l6,-6 l6,6 l6,-6 l6,6" fill="none" stroke="#5d6470" stroke-width="1.5"/>
  <path d="M432,112 l6,-6 l6,6 l6,-6 l6,6" fill="none" stroke="#5d6470" stroke-width="1.5"/>
  <text x="390" y="70" text-anchor="middle" class="s">plates continue up the arm ↑</text>

  <!-- w_gap dimension -->
  <line x1="348" y1="440" x2="432" y2="440" stroke="#2b6fd9" stroke-width="1.5"/>
  <polygon points="348,440 356,436 356,444" fill="#2b6fd9"/><polygon points="432,440 424,436 424,444" fill="#2b6fd9"/>
  <text x="390" y="458" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6fd9">w_gap</text>
  <text x="390" y="472" text-anchor="middle" font-size="11" fill="#2b6fd9">set by the adapter</text>

  <!-- badges + leaders -->
  <circle cx="130" cy="232" r="11" class="badge"/><text x="130" y="236" class="bt">1</text><line x1="130" y1="243" x2="130" y2="262" class="lead"/>
  <circle cx="262" cy="148" r="11" class="badge"/><text x="262" y="152" class="bt">2</text><line x1="262" y1="159" x2="262" y2="170" class="lead"/>
  <circle cx="372" cy="238" r="11" class="badge"/><text x="372" y="242" class="bt">3</text><line x1="368" y1="249" x2="358" y2="302" class="lead"/>
  <circle cx="412" cy="238" r="11" class="badge"/><text x="412" y="242" class="bt">4</text><line x1="412" y1="249" x2="412" y2="270" class="lead"/>
  <circle cx="336" cy="92" r="11" class="badge"/><text x="336" y="96" class="bt">5</text><line x1="336" y1="103" x2="336" y2="112" class="lead"/>
  <circle cx="444" cy="92" r="11" class="badge"/><text x="444" y="96" class="bt">6</text><line x1="444" y1="103" x2="444" y2="112" class="lead"/>
  <circle cx="548" cy="296" r="11" class="badge"/><text x="548" y="300" class="bt">7</text><line x1="540" y1="303" x2="514" y2="324" class="lead"/>
  <circle cx="484" cy="148" r="11" class="badge"/><text x="484" y="152" class="bt">8</text><line x1="484" y1="159" x2="484" y2="170" class="lead"/>

  <!-- turret -->
  <text x="373" y="545" text-anchor="middle" class="s">bracket base — bolts down to the turret</text>

  <!-- legend / explanation -->
  <g transform="translate(626,84)">
    <rect width="454" height="560" rx="8" fill="#fafafa" stroke="#bbb"/>
    <text x="14" y="26" class="tb" font-size="15">What each piece does</text>
    <g font-size="12.5" fill="#1a1a1a">
      <circle cx="22" cy="52" r="9" class="badge"/><text x="22" y="56" class="bt" font-size="11">1</text>
      <text x="40" y="56">Servo body — bolted by its ears to bracket wall A</text>
      <circle cx="22" cy="78" r="9" class="badge"/><text x="22" y="82" class="bt" font-size="11">2</text>
      <text x="40" y="82">Bracket wall A (PETG) — rectangular pocket for the servo</text>
      <circle cx="22" cy="104" r="9" class="badge"/><text x="22" y="108" class="bt" font-size="11">3</text>
      <text x="40" y="108">Servo shaft + the metal horn that ships with the servo</text>
      <circle cx="22" cy="130" r="9" class="badge"/><text x="22" y="134" class="bt" font-size="11">4</text>
      <text x="40" y="134">Horn adapter (PETG) — IN THE GAP between the plates</text>
      <circle cx="22" cy="156" r="9" class="badge"/><text x="22" y="160" class="bt" font-size="11">5</text>
      <text x="40" y="160">Plate 1 — large clearance hole for the shaft to pass</text>
      <circle cx="22" cy="182" r="9" class="badge"/><text x="22" y="186" class="bt" font-size="11">6</text>
      <text x="40" y="186">Plate 2 — the 4.2 mm M4 pivot hole</text>
      <circle cx="22" cy="208" r="9" class="badge"/><text x="22" y="212" class="bt" font-size="11">7</text>
      <text x="40" y="212">M4 pin — wall B, through plate 2, into the adapter</text>
      <circle cx="22" cy="234" r="9" class="badge"/><text x="22" y="238" class="bt" font-size="11">8</text>
      <text x="40" y="238">Bracket wall B + base (a U-shape with wall A)</text>
    </g>

    <text x="14" y="278" class="tb" font-size="14">How the torque travels</text>
    <text x="14" y="298" class="t">servo shaft → metal horn → (2–3 M2 screws) → horn adapter</text>
    <text x="14" y="316" class="t">→ (M3 bolts through plate, adapter, plate) → both plates → arm</text>

    <text x="14" y="352" class="tb" font-size="14">Why it is built this way</text>
    <text x="14" y="372" class="t">• The adapter drives BOTH plates and also acts as the end spacer,</text>
    <text x="22" y="388" class="t">so you only need extra spacers in the middle of the arm.</text>
    <text x="14" y="408" class="t">• The M4 pin supports the far side, so the servo's small output</text>
    <text x="22" y="424" class="t">bearing is not carrying the whole arm sideways on its own.</text>
    <text x="14" y="444" class="t">• The servo sits OUTSIDE the plates, so w_gap only has to fit the</text>
    <text x="22" y="460" class="t">adapter, not the servo.</text>
    <text x="14" y="480" class="t">• Plates 1 and 2 differ at this end (big shaft hole vs 4.2 mm pin</text>
    <text x="22" y="496" class="t">hole). See the note in the chat about keeping one plate file.</text>

    <text x="14" y="530" class="s">The elbow repeats the same pattern one link further out.</text>
    <rect x="14" y="538" width="16" height="10" class="pla"/><text x="36" y="547" class="s">PLA</text>
    <rect x="76" y="538" width="16" height="10" class="petg"/><text x="98" y="547" class="s">PETG</text>
    <rect x="148" y="538" width="16" height="10" class="srv"/><text x="170" y="547" class="s">servo</text>
    <rect x="224" y="538" width="16" height="10" class="stl"/><text x="246" y="547" class="s">steel: horn, shaft, pin, bolts</text>
  </g>
</svg>
