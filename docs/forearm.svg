<svg viewBox="0 0 960 770" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <style>
    .s   { font-size: 11.5px; fill: #444; }
    .tb  { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
    .dim { font-size: 11.5px; fill: #2b6fd9; font-weight: 700; }
    .fa  { fill: #bcd4f5; stroke: #2b4a7a; stroke-width: 1.4; }
    .fl  { fill: #a3c2ec; stroke: #2b4a7a; stroke-width: 1.2; }
    .cut { fill: #ffffff; stroke: #2b4a7a; stroke-width: 1; }
    .see { fill: #e3e7ee; stroke: #2b4a7a; stroke-width: 1; }
    .hid { fill: none; stroke: #2b4a7a; stroke-width: 1; stroke-dasharray: 4,3; }
    .srv { fill: none; stroke: #c26a00; stroke-width: 1.3; stroke-dasharray: 5,3; }
    .wp  { fill: #dff0d8; fill-opacity: 0.6; stroke: #4f7a3a; stroke-width: 1.1; stroke-dasharray: 5,3; }
    .stl { fill: #3d4148; stroke: #111; stroke-width: 0.8; }
    .ax  { stroke: #888; stroke-width: 1; stroke-dasharray: 8,3,2,3; fill: none; }
    .badge { fill: #1a1a1a; }
    .bt  { font-size: 11px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .lead{ stroke: #1a1a1a; stroke-width: 0.9; fill: none; }
  </style>
  <rect width="960" height="770" fill="#fff"/>
  <text x="24" y="30" font-size="20" font-weight="700" fill="#1a1a1a">forearm.SLDPRT with the clevis wrist (to scale, 5 px = 1 mm)</text>
  <text x="24" y="50" class="s">Origin on the elbow axis, +X toward the wrist. Z = 0 is the plate-1 (elbow servo) face, Z = 19 the plate-2 face. SG90 numbers from the GrabCAD model until calipered.</text>

  <!-- ===== TOP VIEW, looking at the Z = 0 side: px = 120 + 5x, py = 170 - 5y ===== -->
  <text x="24" y="84" class="tb">Looking at the Z = 0 side (elbow-servo and SG90 side)</text>
  <line x1="40" y1="170" x2="900" y2="170" class="ax"/>
  <line x1="120" y1="95" x2="120" y2="245" class="ax"/>
  <line x1="720" y1="100" x2="720" y2="240" class="ax"/>
  <path d="M161.5,120 L802,120 A50,50 0 0 1 802,220 L161.5,220 A65,65 0 1 1 161.5,120 Z" class="fa"/>
  <!-- elbow end -->
  <circle cx="120" cy="170" r="50.5" class="cut"/>
  <circle cx="120" cy="170" r="21.25" class="cut"/>
  <circle cx="120" cy="170" r="10" class="hid"/>
  <g class="hid"><circle cx="155" cy="170" r="10"/><circle cx="85" cy="170" r="10"/><circle cx="120" cy="135" r="10"/><circle cx="120" cy="205" r="10"/></g>
  <g class="cut"><circle cx="155" cy="170" r="5.5"/><circle cx="85" cy="170" r="5.5"/><circle cx="120" cy="135" r="5.5"/><circle cx="120" cy="205" r="5.5"/></g>
  <!-- flare: slot X 109.03..136.45 centres, R10 -->
  <path d="M665.5,120 L802,120 A50,50 0 0 1 802,220 L665.5,220 A50,50 0 0 1 665.5,120 Z" class="fl"/>
  <!-- clevis gap closed end at X 109 (hidden) -->
  <line x1="665" y1="120" x2="665" y2="220" class="hid"/>
  <!-- SG90 window X 113.6..136.7, Y ±6.4: see through to the pin-side prong -->
  <rect x="688" y="138" width="115.5" height="64" class="see"/>
  <circle cx="720" cy="170" r="10.6" class="cut"/>
  <!-- ear pilots X 111.25, 139.05 -->
  <circle cx="676.25" cy="170" r="4.25" class="cut"/><circle cx="815.25" cy="170" r="4.25" class="cut"/>
  <!-- SG90 ears outline -->
  <rect x="665.5" y="139.5" width="160.5" height="61" class="srv"/>
  <circle cx="720" cy="170" r="3" fill="#c26a00"/>
  <text x="400" y="112" class="dim" text-anchor="middle">h_forearm 20 deep</text>
  <text x="196" y="96" class="dim">elbow boss Ø26 (d_adapter)</text>
  <line x1="120" y1="262" x2="720" y2="262" stroke="#2b6fd9" stroke-width="1.2"/>
  <polygon points="120,262 128,258 128,266" fill="#2b6fd9"/><polygon points="720,262 712,258 712,266" fill="#2b6fd9"/>
  <text x="420" y="278" class="dim" text-anchor="middle">L2 = 120 (wrist axis = SG90 shaft)</text>
  <line x1="720" y1="262" x2="852" y2="262" stroke="#2b6fd9" stroke-width="1.2"/>
  <polygon points="852,262 844,258 844,266" fill="#2b6fd9"/>
  <text x="786" y="278" class="dim" text-anchor="middle">end at X 146.45</text>

  <circle cx="872" cy="132" r="10" class="badge"/><text x="872" y="136" class="bt">7</text><line class="lead" x1="863" y1="137" x2="846" y2="150"/>
  <circle cx="630" cy="104" r="10" class="badge"/><text x="630" y="108" class="bt">8</text><line class="lead" x1="638" y1="110" x2="672" y2="124"/>
  <circle cx="600" cy="236" r="10" class="badge"/><text x="600" y="240" class="bt">9</text><line class="lead" x1="610" y1="232" x2="665" y2="212"/>
  <circle cx="760" cy="186" r="10" class="badge"/><text x="760" y="190" class="bt">10</text>
  <circle cx="676" cy="104" r="10" class="badge"/><text x="676" y="108" class="bt">11</text><line class="lead" x1="676" y1="114" x2="676" y2="165"/>
  <circle cx="740" cy="104" r="10" class="badge"/><text x="740" y="108" class="bt">12</text><line class="lead" x1="736" y1="114" x2="726" y2="161"/>

  <!-- ===== SECTION ON THE X AXIS: px = 120 + 5x, py = 420 + 5z ===== -->
  <text x="24" y="300" class="tb">Section on the arm's centreline (Y = 0)</text>
  <!-- SG90 body below the flare (drawn first, behind) -->
  <path d="M689.5,437.5 L762,437.5 L762,416.5 L802,416.5 L802,303.75 L689.5,303.75 Z" class="srv"/>
  <rect x="665.5" y="382.25" width="160.5" height="12.5" class="srv"/>
  <line x1="689.5" y1="328" x2="630" y2="328" stroke="#c26a00" stroke-width="3"/>
  <text x="560" y="324" class="s" style="fill:#c26a00">cable to the elbow</text>
  <text x="745" y="345" class="s" style="fill:#c26a00" text-anchor="middle">SG90</text>
  <!-- forearm body incl. flare -->
  <path d="M55,420 L615.5,420 L615.5,394.75 L852,394.75 L852,515 L55,515 Z" class="fa"/>
  <!-- elbow end cuts -->
  <rect x="69.5" y="420" width="101" height="20" class="cut"/>
  <rect x="98.75" y="440" width="42.5" height="13" class="cut"/>
  <rect x="110" y="465" width="20" height="50" class="cut"/>
  <rect x="145" y="450" width="20" height="65" class="cut"/>
  <rect x="75" y="450" width="20" height="65" class="cut"/>
  <rect x="149.5" y="440" width="11" height="10" class="cut"/>
  <rect x="79.5" y="440" width="11" height="10" class="cut"/>
  <!-- wrist cuts: gap Z 3.5..15.5 from X 109; window Z -5.05..3.5; pilots; pin hole Z 15.5..19 -->
  <rect x="665" y="437.5" width="187" height="60" class="cut"/>
  <rect x="688" y="394.75" width="115.5" height="42.75" class="cut"/>
  <rect x="672" y="394.75" width="8.5" height="35" class="cut"/>
  <rect x="811" y="394.75" width="8.5" height="35" class="cut"/>
  <rect x="709.4" y="497.5" width="21.25" height="17.5" class="cut"/>
  <!-- SG90 parts inside the forearm: gear housing to Z 3.5, spline to 6.6 -->
  <path d="M689.5,437.5 L762,437.5 L762,416.5 L802,416.5 L802,394.75 M689.5,437.5 L689.5,394.75" class="srv"/>
  <rect x="707.75" y="437.5" width="24.5" height="15.5" class="srv"/>
  <!-- wrist piece (next part) Z 4..15, R10 end at X 110 -->
  <path d="M720,440 L875,440 L875,495 L720,495 A27.5,27.5 0 0 1 720,440 Z" class="wp"/>
  <rect x="710" y="465" width="20" height="50" class="stl"/>
  <text x="800" y="472" class="s" style="fill:#4f7a3a" text-anchor="middle">wrist piece (next part)</text>
  <line x1="120" y1="410" x2="120" y2="530" class="ax"/>
  <line x1="720" y1="296" x2="720" y2="532" class="ax"/>
  <!-- Z labels -->
  <g class="s">
    <text x="886" y="398">Z −5.05</text>
    <text x="886" y="424">Z 0</text>
    <text x="886" y="441">Z 3.5</text>
    <text x="886" y="501">Z 15.5</text>
    <text x="886" y="519">Z 19</text>
  </g>
  <line x1="40" y1="420" x2="40" y2="515" stroke="#2b6fd9" stroke-width="1.2"/>
  <polygon points="40,420 36,428 44,428" fill="#2b6fd9"/><polygon points="40,515 36,507 44,507" fill="#2b6fd9"/>
  <text x="34" y="472" class="dim" text-anchor="end">19</text>
  <text x="24" y="550" class="s">Servo prong 8.55 thick (3.5 + 5.05 flare). Gap 12, centred on the forearm mid-plane, so the wrist and gripper sit on the arm plane.</text>
  <text x="24" y="568" class="s">The SG90 gear housing ends flush with the gap; its spline (3.1) reaches into the gap and drives the wrist piece through the horn. 4 mm dowel on the far side.</text>

  <!-- elbow-end callouts -->
  <circle cx="240" cy="150" r="10" class="badge"/><text x="240" y="154" class="bt">1</text>
  <circle cx="200" cy="440" r="10" class="badge"/><text x="200" y="444" class="bt">2</text><line class="lead" x1="190" y1="437" x2="171" y2="430"/>
  <circle cx="230" cy="462" r="10" class="badge"/><text x="230" y="466" class="bt">3</text><line class="lead" x1="220" y1="460" x2="141" y2="448"/>
  <circle cx="230" cy="494" r="10" class="badge"/><text x="230" y="498" class="bt">4</text><line class="lead" x1="220" y1="494" x2="130" y2="490"/>
  <circle cx="200" cy="402" r="10" class="badge"/><text x="200" y="406" class="bt">5</text><line class="lead" x1="190" y1="408" x2="160" y2="452"/>
  <circle cx="60" cy="402" r="10" class="badge"/><text x="60" y="406" class="bt">6</text><line class="lead" x1="66" y1="411" x2="84" y2="442"/>

  <!-- key -->
  <g transform="translate(24,590)">
    <rect width="912" height="164" rx="8" fill="#fafafa" stroke="#bbb"/>
    <g font-size="12" fill="#1a1a1a">
      <text x="16" y="24"><tspan font-weight="700">1</tspan>  Body: Ø26 boss + 20-wide slot to X = L2, extruded 19</text>
      <text x="16" y="44"><tspan font-weight="700">2</tspan>  Horn pocket Ø20.2 × 4.0</text>
      <text x="16" y="64"><tspan font-weight="700">3</tspan>  Centre-screw recess Ø8.5 × 2.6</text>
      <text x="16" y="84"><tspan font-weight="700">4</tspan>  Dowel bore Ø4.0 × 10 from Z = 19</text>
      <text x="16" y="104"><tspan font-weight="700">5</tspan>  4 access bores Ø4 at r 7, 13 deep from Z = 19</text>
      <text x="16" y="124"><tspan font-weight="700">6</tspan>  4 × Ø2.2 through the 2 mm floor (M2 × 5)</text>
      <text x="16" y="148" fill="#4f7a3a">Green dashed = wrist piece (next part), orange dashed = SG90</text>
      <text x="460" y="24"><tspan font-weight="700">7</tspan>  Wrist extension: slot from the wrist axis, 16.45 long, 19 thick</text>
      <text x="460" y="44"><tspan font-weight="700">8</tspan>  Flare: slot from X 109.03 to the end centre, 5.05 out of the Z = 0 face</text>
      <text x="460" y="64"><tspan font-weight="700">9</tspan>  Clevis gap 12 (Z 3.5 to 15.5), from X 109 out through the tip</text>
      <text x="460" y="84"><tspan font-weight="700">10</tspan> SG90 window 23.15 × 12.8 through the servo prong</text>
      <text x="460" y="104"><tspan font-weight="700">11</tspan> 2 ear-screw pilots Ø1.7 × 7 from the flare face, 27.8 apart</text>
      <text x="460" y="124"><tspan font-weight="700">12</tspan> Pin hole Ø4.25 through the pin-side prong (4 mm dowel)</text>
      <text x="460" y="148">Print Z = 19 down; the gap needs support under the servo prong</text>
    </g>
  </g>
</svg>
