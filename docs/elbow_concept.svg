<svg viewBox="0 0 1240 860" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <style>
    .t   { font-size: 13px; fill: #1a1a1a; }
    .tb  { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
    .s   { font-size: 11.5px; fill: #444; }
    .dim { font-size: 11.5px; fill: #2b6fd9; font-weight: 700; }
    .warn{ font-size: 11.5px; fill: #b3261e; font-weight: 700; }
    .pla { fill: #d9dde3; stroke: #5d6470; stroke-width: 1.2; }
    .fa  { fill: #bcd4f5; stroke: #2b4a7a; stroke-width: 1.4; }
    .brk { fill: #cfe3c4; stroke: #4f7a3a; stroke-width: 1.2; }
    .srv { fill: #f6b26b; stroke: #a35a00; stroke-width: 1.2; }
    .hrn { fill: #6d6d6d; stroke: #222; stroke-width: 1; }
    .stl { fill: #3d4148; stroke: #111; stroke-width: 0.8; }
    .cut { fill: #ffffff; stroke: #2b4a7a; stroke-width: 1; }
    .ax  { stroke: #888; stroke-width: 1; stroke-dasharray: 6,4; fill: none; }
    .lead{ stroke: #1a1a1a; stroke-width: 0.9; fill: none; }
    .badge { fill: #1a1a1a; }
    .bt  { font-size: 11px; font-weight: 700; fill: #fff; text-anchor: middle; }
  </style>
  <rect width="1240" height="860" fill="#fff"/>
  <text x="24" y="32" font-size="21" font-weight="700" fill="#1a1a1a">Elbow concept — solid one-piece forearm nested in the upper arm (to scale, servo numbers from the MG996R model)</text>
  <text x="24" y="52" class="s">Left: section through the elbow axis (5 px = 1 mm). Right: side view of the forearm swept from straight (0°) to fully folded (−130°, the firmware limit) (1.6 px = 1 mm).</text>

  <!-- ================= SECTION ================= -->
  <!-- px = 260 + 5z ; py = 360 -/+ 5r ; z = 0 at plate 1's outer face -->
  <line x1="40" y1="360" x2="430" y2="360" class="ax"/>
  <text x="40" y="378" class="s">elbow axis</text>

  <!-- elbow servo: body z -37.5..-0.5 r±10, boss z -0.5..1.5 r±6.5, ears z -10.5..-8.2 -->
  <rect x="72.5" y="310" width="185" height="100" class="srv"/>
  <text x="160" y="364" class="tb" text-anchor="middle">elbow MG996R</text>
  <rect x="257.5" y="327.5" width="10" height="65" class="srv"/>
  <rect x="207.5" y="290" width="11.5" height="20" class="srv"/>
  <rect x="207.5" y="410" width="11.5" height="20" class="srv"/>

  <!-- elbow servo mount (new part): wall z -8.2..-4.2, 30 wide, window r>10.3; standoffs are 30 mm toward the shoulder, out of this section -->
  <rect x="219" y="285" width="20" height="23.5" class="brk"/>
  <rect x="219" y="411.5" width="20" height="23.5" class="brk"/>

  <!-- plate 1 (upper arm, Ø15 big end at the elbow): z 0..3, r 7.5..17 -->
  <rect x="260" y="275" width="15" height="47.5" class="pla"/>
  <rect x="260" y="397.5" width="15" height="47.5" class="pla"/>

  <!-- horn: hub z 2.0..5.2 r±4.4 ; disc z 5.2..7.5 r±10 ; centre screw head z 7.5..9.85 r±3.75 -->
  <rect x="270" y="338" width="16" height="44" class="hrn"/>

  <!-- forearm (solid): z 3.5..22.5, clipped at r±10 -->
  <rect x="277.5" y="310" width="95" height="100" class="fa"/>
  <rect x="277.5" y="309.5" width="20" height="101" class="cut"/>   <!-- horn pocket z3.5..7.5 Ø20.2 -->
  <rect x="297.5" y="338.75" width="13" height="42.5" class="cut"/> <!-- recess z7.5..10.1 Ø8.5 -->
  <rect x="307.5" y="315" width="65" height="20" class="cut"/>      <!-- access bore r5..9 z9.5..22.5 -->
  <rect x="297.5" y="319.5" width="10" height="11" class="cut"/>    <!-- Ø2.2 through 2 mm floor -->
  <rect x="322.5" y="350" width="50" height="20" class="cut"/>      <!-- pin bore Ø4 z12.5..22.5 -->

  <rect x="286" y="310" width="11.5" height="100" class="hrn"/>     <!-- disc -->
  <rect x="297.5" y="341.25" width="11.75" height="37.5" class="stl"/> <!-- centre screw head -->
  <rect x="307.5" y="316.25" width="6.5" height="17.5" class="stl"/>   <!-- M2 head -->
  <rect x="283.5" y="320" width="24" height="10" class="stl"/>         <!-- M2 shank into disc -->

  <!-- plate 2 (upper arm, pin end at the elbow): z 23..26, r 2.125..10 -->
  <rect x="375" y="310" width="15" height="39.4" class="pla"/>
  <rect x="375" y="370.6" width="15" height="39.4" class="pla"/>
  <!-- pin: Ø4 dowel pressed in the forearm, turning in plate 2, flush outside -->
  <rect x="322.5" y="350" width="67.5" height="20" class="stl"/>

  <!-- gap dims -->
  <line x1="275" y1="470" x2="375" y2="470" stroke="#2b6fd9" stroke-width="1.2"/>
  <polygon points="275,470 283,466 283,474" fill="#2b6fd9"/><polygon points="375,470 367,466 367,474" fill="#2b6fd9"/>
  <text x="325" y="486" class="dim" text-anchor="middle">upper-arm gap 20</text>
  <line x1="277.5" y1="250" x2="372.5" y2="250" stroke="#2b6fd9" stroke-width="1.2"/>
  <polygon points="277.5,250 285.5,246 285.5,254" fill="#2b6fd9"/><polygon points="372.5,250 364.5,246 364.5,254" fill="#2b6fd9"/>
  <text x="325" y="243" class="dim" text-anchor="middle">forearm 19 (0.5 each side)</text>

  <!-- section callouts -->
  <circle cx="160" cy="292" r="10" class="badge"/><text x="160" y="296" class="bt">1</text><line class="lead" x1="160" y1="302" x2="160" y2="310"/>
  <circle cx="229" cy="236" r="10" class="badge"/><text x="229" y="240" class="bt">2</text><line class="lead" x1="229" y1="246" x2="229" y2="285"/>
  <circle cx="268" cy="214" r="10" class="badge"/><text x="268" y="218" class="bt">3</text><line class="lead" x1="268" y1="224" x2="268" y2="275"/>
  <circle cx="300" cy="214" r="10" class="badge"/><text x="300" y="218" class="bt">4</text><line class="lead" x1="298" y1="224" x2="292" y2="310"/>
  <circle cx="352" cy="292" r="10" class="badge"/><text x="352" y="296" class="bt">5</text><line class="lead" x1="352" y1="302" x2="352" y2="312"/>
  <circle cx="382" cy="214" r="10" class="badge"/><text x="382" y="218" class="bt">6</text><line class="lead" x1="382" y1="224" x2="382" y2="310"/>
  <circle cx="412" cy="392" r="10" class="badge"/><text x="412" y="396" class="bt">7</text><line class="lead" x1="404" y1="386" x2="388" y2="368"/>
  <text x="40" y="520" class="s">Section across the arm: shows one horn screw (top); the forearm continues out of the page.</text>
  <text x="40" y="538" class="s">The mount's standoffs are 30 mm toward the shoulder (see the side view), out of this section.</text>

  <!-- ================= SIDE VIEW ================= -->
  <!-- elbow axis at (900,330); px = 900 + 1.6x ; py = 330 - 1.6y -->
  <text x="560" y="92" class="tb" font-size="14">Side view — fold sweep (plates seen edge-on in the arm's plane)</text>

  <!-- upper arm plate 1 outline: big end R17 at the elbow, ~20 deep waist, shoulder end R10 at x=-120 -->
  <path d="M900,302.8 L836,314 L708,314 A16,16 0 0 0 708,346 L836,346 L900,357.2 A27.2,27.2 0 0 0 900,302.8 Z" fill="#eef0f3" stroke="#5d6470" stroke-width="1.3"/>
  <circle cx="708" cy="330" r="3" fill="#5d6470"/><text x="690" y="304" class="s">shoulder axis</text>
  <circle cx="852" cy="322" r="5.6" class="pla"/><circle cx="852" cy="338" r="5.6" class="pla"/>
  <circle cx="756" cy="322" r="5.6" class="pla"/><circle cx="756" cy="338" r="5.6" class="pla"/>
  <text x="620" y="372" class="s">spacers, 30 mm from each axis</text>

  <!-- elbow mount outline (outside plate 1): x -35..+41.5, 30 wide; standoffs on the spacer holes at x -30 -->
  <rect x="844" y="306" width="122.4" height="48" rx="8" fill="none" stroke="#4f7a3a" stroke-width="1.3" stroke-dasharray="5,3"/>
  <circle cx="852" cy="322" r="5.6" fill="none" stroke="#4f7a3a" stroke-width="1.6"/><circle cx="852" cy="338" r="5.6" fill="none" stroke="#4f7a3a" stroke-width="1.6"/>
  <!-- elbow servo outline: short end 10 toward the shoulder, long end 30.9 out past the elbow -->
  <rect x="884" y="314" width="65.4" height="32" fill="none" stroke="#a35a00" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="560" y="236" class="s" style="fill:#a35a00">elbow servo, dashed (outside plate 1), long end out past the elbow</text>
  <text x="560" y="252" class="s" style="fill:#4f7a3a">mount, dashed green: standoffs + M3×40 on the two spacer holes 30 mm back</text>

  <!-- flare limit -->
  <circle cx="900" cy="330" r="56" fill="none" stroke="#b3261e" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="944" y="282" class="warn">r 35: earliest a flare can start</text>

  <!-- forearm: rounded bar, 20 deep, axis-to-axis 120, R10 ends -->
  <g transform="rotate(130 900 330)" opacity="0.55">
    <rect x="884" y="314" width="224" height="32" rx="16" class="fa"/>
    <circle cx="1092" cy="330" r="3" fill="#2b4a7a"/>
  </g>
  <g transform="rotate(65 900 330)" opacity="0.35">
    <rect x="884" y="314" width="224" height="32" rx="16" class="fa"/>
  </g>
  <rect x="884" y="314" width="224" height="32" rx="16" class="fa"/>
  <circle cx="1092" cy="330" r="3" fill="#2b4a7a"/>
  <text x="1040" y="306" class="s">wrist axis (SG90)</text>
  <circle cx="900" cy="330" r="3.5" fill="#1a1a1a"/>
  <text x="1110" y="334" class="tb">0°</text>
  <text x="975" y="470" class="tb">−65°</text>
  <text x="780" y="476" class="tb">−130°</text>

  <!-- clearance callout at -130 -->
  <line x1="852" y1="338" x2="871" y2="352" stroke="#2b6fd9" stroke-width="1.2"/>
  <text x="742" y="420" class="dim">6.3 mm to the nearest spacer at −130°</text>

  <!-- ================= KEY ================= -->
  <g transform="translate(24,560)">
    <rect width="1192" height="280" rx="8" fill="#fafafa" stroke="#bbb"/>
    <g font-size="12" fill="#1a1a1a">
      <circle cx="20" cy="22" r="9" class="badge"/><text x="20" y="26" class="bt">1</text><text x="36" y="26">Elbow servo — fixed to the upper arm, outside plate 1</text>
      <circle cx="20" cy="46" r="9" class="badge"/><text x="20" y="50" class="bt">2</text><text x="36" y="50">Elbow servo mount (new part): wall with window + ear holes; standoffs on the spacer holes 30 mm back</text>
      <circle cx="20" cy="70" r="9" class="badge"/><text x="20" y="74" class="bt">3</text><text x="36" y="74">Plate 1 — the Ø15 big end is at the elbow (same plate file, rotated)</text>
      <circle cx="20" cy="94" r="9" class="badge"/><text x="20" y="98" class="bt">4</text><text x="36" y="98">Horn (Ø20 disc) in a pocket in the forearm — the forearm is its own horn adapter</text>
      <circle cx="20" cy="118" r="9" class="badge"/><text x="20" y="122" class="bt">5</text><text x="36" y="122">Solid forearm, 19 wide × 20 deep, M2 horn screws from the plate-2 side through access bores</text>
      <circle cx="20" cy="142" r="9" class="badge"/><text x="20" y="146" class="bt">6</text><text x="36" y="146">Plate 2 — its Ø4.25 pin end is at the elbow</text>
      <circle cx="20" cy="166" r="9" class="badge"/><text x="20" y="170" class="bt">7</text><text x="36" y="170">4 mm dowel pressed into the forearm (Ø4.0 bore), turning in plate 2, flush outside</text>
    </g>
    <text x="660" y="26" class="tb">Why one solid piece works well</text>
    <text x="660" y="46" class="s">• Prints flat on its side with no supports; every hole stays vertical.</text>
    <text x="660" y="64" class="s">• No spacers, no separate adapter: horn pocket, pin bore and SG90 pocket are all in one part.</text>
    <text x="660" y="82" class="s">• Folds to the full −130° with 6.3 mm to spare past the upper-arm spacers.</text>
    <text x="660" y="100" class="s">• The SG90 (22.5 tall along its shaft) is wider than 19 mm, so at the wrist it sticks out</text>
    <text x="672" y="116" class="s">sideways — fine, that end never comes near the upper arm.</text>
    <text x="660" y="146" class="tb">Watch</text>
    <text x="660" y="166" class="s">• Mass: about 28 g at 4 walls + 20% infill (rough estimate) vs the 25 g forearm budget.</text>
    <text x="672" y="182" class="s">Each extra 10 g costs ~0.18 kg·cm at the shoulder (SF 2.44 → ~2.35). Lighten with a slot if needed.</text>
    <text x="660" y="200" class="s">• A flare is optional; if you want one, start it at least 35 mm from the elbow axis.</text>
    <text x="660" y="218" class="s">• The elbow servo sticks out ~38 mm past plate 1 on the wall-B side — check it against the turret later.</text>
    <text x="20" y="214" class="tb">Assembly order</text>
    <text x="20" y="234" class="s">servo into its mount → mount onto plate 1 → horn + centre screw → forearm over the horn, M2 screws through the access bores</text>
    <text x="20" y="252" class="s">→ dowel into the forearm → plate 2 + spacers over the dowel, M3×40 through the mount at the two back holes. Clearances: 0.5 mm each side of the forearm (add thin washers if it rattles).</text>
    <rect x="1000" y="236" width="14" height="9" class="fa"/><text x="1020" y="245" class="s">forearm</text>
    <rect x="1080" y="236" width="14" height="9" class="brk"/><text x="1100" y="245" class="s">mount</text>
    <rect x="1000" y="254" width="14" height="9" class="pla"/><text x="1020" y="263" class="s">plates</text>
    <rect x="1080" y="254" width="14" height="9" class="srv"/><text x="1100" y="263" class="s">servo</text>
  </g>
</svg>
