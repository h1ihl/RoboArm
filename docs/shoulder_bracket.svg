<circle cx="20" cy="20" r="9" class="badge"/><text x="20" y="24" class="bt">1</text><text x="36" y="24" class="t" font-size="12.5">Servo: long end up, short end down. Case drops through the window from the outside; the ears seat on wall A's outer face</text>
<circle cx="20" cy="42" r="9" class="badge"/><text x="20" y="46" class="bt">2</text><text x="36" y="46" class="t" font-size="12.5">Wall A, 4 mm (t_bracket), window 41.5 × 20.6; top 41.5 above the axis; 1.6 wide notches at both window ends clear the ear ribs</text>
<circle cx="20" cy="64" r="9" class="badge"/><text x="20" y="68" class="bt">3</text><text x="36" y="68" class="t" font-size="12.5">4 × M3×10, heads in the 4.2 mm gap behind wall A (installed before plate 2), plain or nyloc nut on top of each ear</text>
<circle cx="20" cy="86" r="9" class="badge"/><text x="20" y="90" class="bt">4</text><text x="36" y="90" class="t" font-size="12.5">Wall B, 4 mm, 1 mm clear of plate 1 (washer between); rounded top R15 around the pin</text>
<circle cx="20" cy="108" r="9" class="badge"/><text x="20" y="112" class="bt">5</text><text x="36" y="112" class="t" font-size="12.5">Pin boss: wall B is 8 mm thick here; Ø4 hole (press-fit) for the shoulder pin — see note</text>
<circle cx="20" cy="130" r="9" class="badge"/><text x="20" y="134" class="bt">6</text><text x="36" y="134" class="t" font-size="12.5">Foot, 6 mm thick, spans both walls; fillet R4 where each wall meets it. 4 × M3 heat-set inserts</text>
<circle cx="20" cy="152" r="9" class="badge"/><text x="20" y="156" class="bt">7</text><text x="36" y="156" class="t" font-size="12.5">Thrust washer, 1 mm, between plate 1 and wall B</text>
<text x="24" y="182" class="s">Colours: green = bracket, orange = servo, grey = PLA plates, blue = adapter, dark = steel / horn, gold = brass insert.</text>
